# NAIVE deployment: what most tutorials show.
# No probes, no resources, no graceful shutdown. Used as the "before" in every experiment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - name: orders-api
        image: DOCKERHUB_USER/orders-api:1.0.0   # replaced by `make deploy STEP=1-naive`
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: v1
        - name: WARMUP_SECONDS          # app needs 15s after start before it can serve
          value: "15"
        - name: SERVER_SHUTDOWN         # in-flight requests are cut off on SIGTERM
          value: immediate
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
