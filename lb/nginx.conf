# E7: Nginx as a Layer 4 (TCP) load balancer in front of the Kubernetes worker nodes.
# Replace the IPs with your worker node IPs (`kubectl get nodes -o wide`).
# Install on a separate machine: copy to /etc/nginx/nginx.conf, then `sudo nginx -s reload`.

events {}

stream {
    upstream k8s_workers {
        # Passive health check: after 2 failed connections, skip the node for 10s.
        server WORKER1_IP:30080 max_fails=2 fail_timeout=10s;
        server WORKER2_IP:30080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        proxy_pass k8s_workers;
        proxy_connect_timeout 2s;
    }
}
